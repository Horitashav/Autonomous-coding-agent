services:
  postgres:
    image: postgres:16-alpine
    container_name: agent_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: agent_admin
      POSTGRES_PASSWORD: agent_secret_password
      POSTGRES_DB: agent_production_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agent_admin -d agent_production_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: