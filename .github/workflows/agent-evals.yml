name: Production Quality & Security Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  security-and-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Linting & Audit Tools
        run: pip install ruff bandit pip-audit
      - name: Code Quality (Ruff)
        run: ruff check src/ tests/
      - name: Static Security Scan (Bandit)
        run: bandit -r src/ -ll -ii
      - name: Audit Dependencies
        run: pip-audit

  integration-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: agent_admin
          POSTGRES_PASSWORD: agent_secret_password
          POSTGRES_DB: agent_production_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install App Dependencies
        run: pip install -e ".[dev]"
      - name: Build Sandbox Image
        run: docker build -f Dockerfile.sandbox -t agent-sandbox .
      - name: Run Pytest Suite
        env:
          JWT_SECRET_KEY: "test-secret-key-that-is-at-least-32-chars-long"
          DATABASE_URL: "postgresql+psycopg2://agent_admin:agent_secret_password@localhost:5432/agent_production_db"
          GROQ_API_KEY: "test_key"
        run: pytest tests/ -v